# Builds the double-click host apps (no Node install needed) and attaches them to GitHub releases.
# Trigger: push a tag like v1.2.0, publish a release, or run it by hand (Actions → Host apps → Run workflow).
name: Host apps
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Install ldid (ad-hoc signing of the macOS binaries; Apple Silicon refuses unsigned code)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/ldid" https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$RUNNER_TEMP/bin/ldid" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: node host/build.js
      - name: Smoke test (Linux binary)
        run: node test/host-app-test.js dist/The-Lowlands-Host-linux/the-lowlands-host
      - uses: actions/upload-artifact@v4
        with:
          name: host-apps
          path: |
            dist/*.zip
            dist/*.tar.gz
  smoke-mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: host-apps, path: dist }
      - name: Unzip (ditto keeps permissions like Finder) and verify signatures
        run: |
          cd dist
          for a in arm64 x64; do ditto -x -k The-Lowlands-Host-mac-$a.zip . && ls -l The-Lowlands-Host-mac-$a; codesign -dv The-Lowlands-Host-mac-$a/the-lowlands-host; done
      - name: Smoke test (Apple Silicon binary)
        run: node test/host-app-test.js "dist/The-Lowlands-Host-mac-arm64/the-lowlands-host"
      - name: Smoke test (Intel binary under Rosetta)
        continue-on-error: true
        run: arch -x86_64 /usr/bin/true && node test/host-app-test.js "dist/The-Lowlands-Host-mac-x64/the-lowlands-host"
  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: host-apps, path: dist }
      - run: Expand-Archive dist/The-Lowlands-Host-windows.zip -DestinationPath dist
        shell: pwsh
      - run: node test/host-app-test.js dist/The-Lowlands-Host-windows/The-Lowlands-Host.exe
  release:
    needs: [build, smoke-mac, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: host-apps, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist/*.zip
            dist/*.tar.gz

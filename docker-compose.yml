services:
  the-lowlands:
    build: .
    image: the-lowlands:latest
    container_name: the-lowlands
    ports:
      # host port 8090 (override: PORT=xxxx docker compose up -d) -> container 8080.
      # Not 8080 on the host: on a Synology, DSM's nginx / Web Station already listens there.
      - "${PORT:-8090}:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
